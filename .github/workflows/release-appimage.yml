name: Publish v1.0.0 AppImage
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-appimage.yml
      - version.py
      - packaging/appimage/**
      - RELEASE_NOTES.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.0.0
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'alsiniz/dirigera-plasma'
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AppImage build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 curl
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s" "$@"\n' \
            "$RUNNER_TEMP/appimagetool.AppImage" | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Check version and test before releasing
        run: |
          set -euo pipefail
          python - <<'PY'
          from version import VERSION
          assert VERSION == '1.0.0', f'Expected v1.0.0, got {VERSION}'
          PY
          python -m pip install -r requirements.txt
          python -m unittest discover -p 'test_*.py' -v
      - name: Build AppImage
        run: ./packaging/appimage/build.sh
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mv DIRIGERA-Plasma-x86_64.AppImage DIRIGERA-Plasma-v1.0.0-x86_64.AppImage
          chmod +x DIRIGERA-Plasma-v1.0.0-x86_64.AppImage
          sha256sum DIRIGERA-Plasma-v1.0.0-x86_64.AppImage > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DIRIGERA-Plasma-v1.0.0-assets
          path: |
            DIRIGERA-Plasma-v1.0.0-x86_64.AppImage
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Create GitHub v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; refusing to overwrite it.'
            exit 0
          fi
          gh release create v1.0.0 \
            DIRIGERA-Plasma-v1.0.0-x86_64.AppImage \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'DIRIGERA Plasma v1.0.0' \
            --notes-file RELEASE_NOTES.md \
            --latest
