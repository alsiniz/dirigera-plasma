name: Publish stable AppImage
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-appimage.yml
      - version.py
      - packaging/appimage/**
      - RELEASE_NOTES.md
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the AppImage and checksum to GitHub Releases
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-appimage
  cancel-in-progress: false
jobs:
  release:
    if: github.repository_id == '1467584318' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      LYSNAV_REQUIRE_QT_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AppImage build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 curl
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s" "$@"\n' \
            "$RUNNER_TEMP/appimagetool.AppImage" | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Check version and test before releasing
        id: version
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from version import VERSION
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', VERSION):
              raise ValueError(f'Expected a stable release version, got {VERSION}')
          print(f'tag=v{VERSION}')
          PY
          python -m pip install -r requirements.txt
          dbus-run-session -- python -m unittest discover -p 'test_*.py' -v
      - name: Build AppImage
        run: ./packaging/appimage/build.sh
      - name: Prepare release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          asset="Lysnav-Plasma-$TAG-x86_64.AppImage"
          mv Lysnav-Plasma-x86_64.AppImage "$asset"
          chmod +x "$asset"
          sha256sum "$asset" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: Lysnav-Plasma-${{ steps.version.outputs.tag }}-assets
          path: |
            Lysnav-Plasma-${{ steps.version.outputs.tag }}-x86_64.AppImage
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            "Lysnav-Plasma-$TAG-x86_64.AppImage" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Lysnav for KDE Plasma $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
