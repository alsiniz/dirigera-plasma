name: Plasma tests and builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push builds cover branches in this repository. Fork PRs need their own run.
# Keep PR concurrency separate so a skipped same-repository PR cannot cancel a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q app.py core.py tray_sni.py tray_compat.py tray_menu_model.py icon_theme.py pairing.py version.py inventory.py
      - name: Test offline safety and menu logic
        run: python -m unittest discover -p 'test_*.py' -v
  qt-ui-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      LYSNAV_REQUIRE_QT_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Verify Qt test imports
        run: python -c "import app; import test_ui; assert test_ui.ClickToJumpSlider is not None, 'Qt tests would be skipped'"
      - name: Test Qt sliders and pairing
        run: python -m unittest test_ui -v
      - name: Test native D-Bus menu
        run: dbus-run-session -- python -m unittest test_tray_dbus -v

  appimage:
    needs: [unit-tests, qt-ui-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 curl
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool.AppImage" \
            'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage'
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s" "$@"\n' \
            "$RUNNER_TEMP/appimagetool.AppImage" | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build portable AppImage
        run: ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Lysnav-Plasma-AppImage-x86_64
          path: Lysnav-Plasma-x86_64.AppImage
          if-no-files-found: error
  flatpak:
    needs: [unit-tests, qt-ui-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3 python3-venv git
      - name: Build Flatpak bundle
        run: ./packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Lysnav-Plasma-Flatpak-x86_64
          path: lysnav.flatpak
          if-no-files-found: error
